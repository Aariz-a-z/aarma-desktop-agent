[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers -m "not network"
markers =
    network: needs a live internet connection. Excluded from the default run so
        the suite stays offline and deterministic. Run with:
        python -m pytest -m network
filterwarnings =
    error::DeprecationWarning:aarma.*
